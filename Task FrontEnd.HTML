<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML Form Example</h1>
    <p>
This is an example of an <s>HTML4</s> <u>HTML5</u> form containing various input controls.
</p>
<form>

<fieldset>
<legend>User Information</legend>

<label for="username">Username:</label>
<input type="text" id="username"><br><br>

<label for="email">Email:</label>
<input type="email" id="email"><br><br>

<label for="password">Password:</label>
<input type="password" id="password">

</fieldset>

<fieldset>
<legend>Contact Information</legend>

<label for="phone">Phone:</label>
<input type="tel" id="phone"><br><br>

<label for="message">Message:</label><br>
<textarea id="message"rows="5" cols="30"></textarea>

</fieldset>

<form>
<fieldset>
<legend>Subscription</legend>

<input type="radio" id="subscribe" name="newsletter" value="yes">
<label for="subscribe">Subscribe to newsletter</label><br>

<input type="radio" id="no-subscribe" name="newsletter" value="no">
<label for="no-subscribe">Do not subscribe</label>

</fieldset>

<fieldset>
<legend>Preferred Language</legend>
 <label for="language">select your Preferred Language:</label>
  <select id="language" name="language">
    <option value="english">English</option>
    <option value="spanish">Spanish</option>
    <option value="french">French</option>
    <option value="german">German</option>
  </select>
</fieldset>


<fieldset>
<legend>Feedback</legend>

<label for="rate">Rate our service:</label>
<input type="range" id="rate" name="rate" min="0" max="10">

</fieldset>


</form>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">


</form>

    </form>
</body>
</html>
